# Read the Docs build configuration (schema v2) — English site.
# Read the Docs project: `myqcd` (language `en`).
# URL: https://myqcd.readthedocs.io/en/latest/
# All paths are relative to the repository root.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/en/conf.py

formats:
  - pdf
  - epub

python:
  install:
    - requirements: docs/en/requirements.txt

submodules:
  exclude: all
