# Read the Docs build configuration (schema v2) — Chinese site.
# Read the Docs project: `myqcd` (language `zh-cn`).
# URL: https://myqcd.readthedocs.io/zh-cn/latest/
# All paths are relative to the repository root.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/zh/conf.py

formats:
  - pdf
  - epub

python:
  install:
    - requirements: docs/zh/requirements.txt

submodules:
  exclude: all
