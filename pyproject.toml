[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myqcd"
version = "0.3.0"
description = "Executable audits for lattice-QCD formulas, operator construction, and Feynman diagram structure."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ZhangXin8069" }]
keywords = [
    "lattice-qcd",
    "qcd",
    "operator-construction",
    "feynman-diagrams",
    "sympy",
    "physics",
]
dependencies = ["sympy>=1.12"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Documentation = "https://myqcd.readthedocs.io/"
Homepage = "https://gitlab.itp.ac.cn/zhangxin8069/MyQCD"
"国内开发 (GitLab)" = "https://gitlab.itp.ac.cn/zhangxin8069/MyQCD"
"国内发布 (Gitee)" = "https://gitee.com/zhangxin8069/MyQCD"
"国外发布 (GitHub)" = "https://github.com/zhangxin8069/MyQCD"
Issues = "https://gitlab.itp.ac.cn/zhangxin8069/MyQCD/-/issues"

[project.scripts]
myqcd = "myqcd.audit:main"

[tool.setuptools]
packages = ["myqcd"]
include-package-data = false

[tool.setuptools.package-data]
myqcd = ["py.typed"]
